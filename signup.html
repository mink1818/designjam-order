<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  
  <meta name="description" content="디자인 삭스 거래처용 상품 주문 및 주문조회 시스템">
  <meta property="og:title" content="디자인 삭스 주문관리 (거래처)">
  <meta property="og:description" content="디자인 삭스 거래처용 상품 주문 및 주문조회 시스템">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://designjam-order.vercel.app/signup.html">
  <meta property="og:image" content="https://designjam-order.vercel.app/icons/customer-512.png?v=66040">
<title>디자인 삭스 주문관리 (거래처)</title>

  <link rel="stylesheet" href="style.css?v=3720">

  <meta name="theme-color" content="#24589f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="디자인 삭스 거래처">
  <link rel="manifest" href="manifest-customer.webmanifest?v=66040">
  <link rel="icon" href="icons/customer-192.png?v=66040">
  <link rel="apple-touch-icon" href="icons/customer-180.png?v=66040">
</head>

<body data-pwa-app="customer">

<header>
  <h1>🧦 디자인 삭스</h1>
  <p>거래처 회원가입</p>
</header>

<main class="container">

  <section class="product-card auth-card">

    <h2>회원가입</h2>

    <label for="businessName">
      거래처명 *
    </label>

    <input
      id="businessName"
      class="order-input"
      type="text"
      autocomplete="organization"
      placeholder="예: 행복상회"
      pattern="[가-힣ㄱ-ㅎㅏ-ㅣA-Za-z0-9]+"
      title="공백·특수기호 없이 한글·영문·숫자만 입력해주세요."
      maxlength="40"
      required
    >
    <small class="form-help">공백·특수기호 없이 한글·영문·숫자만 입력할 수 있습니다.</small>

    <label for="ownerName">
      대표자명
    </label>

    <input
      id="ownerName"
      class="order-input"
      type="text"
      autocomplete="name"
      placeholder="예: 홍길동"
    >

    <label for="signupPhone">
      휴대폰번호 *
    </label>

    <input
      id="signupPhone"
      class="order-input"
      type="tel"
      inputmode="numeric"
      autocomplete="tel"
      maxlength="13"
      placeholder="예: 010-1234-5678"
    >

    <label for="address">주소 *</label>
    <div class="address-search-row">
      <input id="address" class="order-input" type="text" autocomplete="street-address" placeholder="주소 검색 버튼을 눌러주세요" readonly>
      <button id="signupAddressSearch" class="cart-btn address-search-btn" type="button">주소 검색</button>
    </div>
    <p class="address-search-help">도로명·구주소(지번)·건물명으로 검색할 수 있습니다.</p>
    <input id="addressDetail" class="order-input" type="text" autocomplete="address-line2" placeholder="상세주소 (동·호수 등)">

    <label for="signupPassword">
      비밀번호 *
    </label>

    <input
      id="signupPassword"
      class="order-input"
      type="password"
      autocomplete="new-password"
      minlength="6"
      placeholder="6자리 이상"
    >

    <label for="passwordConfirm">
      비밀번호 확인 *
    </label>

    <input
      id="passwordConfirm"
      class="order-input"
      type="password"
      autocomplete="new-password"
      minlength="6"
      placeholder="비밀번호 다시 입력"
    >

    <button
      id="signupButton"
      class="cart-btn"
      type="button"
    >
      회원가입 신청
    </button>

    <button
      class="cart-btn gray-btn"
      type="button"
      onclick="location.href='login.html'"
    >
      로그인으로 이동
    </button>

    <div id="signupMessage"></div>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" data-designsocks-postcode="1"></script>
<script src="js/address-search.js?v=66420"></script>
<script src="js/signup.js?v=66420"></script>

<script src="js/pwa.js?v=66180"></script>
<script src="js/version-badge.js?v=66420"></script>
<script src="js/ui-preferences.js?v=66040"></script>
</body>
</html>
