<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S·B·I 정산</title><link rel="stylesheet" href="css/admin.css?v=67079"><link rel="stylesheet" href="css/sbi-settlement.css?v=67079"></head>
<body class="auth-pending" data-session-page="admin" data-pwa-app="admin" data-app-version="6.7.79"><header><h1>💰 S·B·I 정산</h1><p>고객 출고금액과 S·B 원가를 비교해 정산금액을 계산합니다.</p></header><main class="settlement-shell">
<section class="settlement-toolbar"><label>정산일<input id="settlementDate" type="date"></label><div class="settlement-tabs"><button data-code="S" class="active">S 거래처별</button><button data-code="B">B 일일합계</button><button data-code="I">I 일일합계</button></div><button id="loadSettlement" type="button">출고금액 불러오기</button></section>
<section class="settlement-summary" id="settlementSummary"></section>
<section class="settlement-paste" id="settlementPaste"><h2>카톡 정산내용 붙여넣기</h2><p id="settlementHelp">S에서 받은 내용을 계속 이어 붙여넣으세요. 이름이 없어도 수량 × 단가만 계산됩니다.</p><textarea id="settlementInput" rows="14" placeholder="카톡 내용을 그대로 붙여넣으세요."></textarea><div class="settlement-actions"><button id="analyzeSettlement" type="button">자동 분석</button></div></section>
<section class="settlement-results"><div class="settlement-result-heading"><h2>분석·계산 결과</h2><button id="saveSettlement" type="button" disabled>분석결과 저장</button></div><div id="settlementResult"><p>정산일과 출고지를 선택한 뒤 불러오세요.</p></div></section>
<section class="settlement-history"><h2>최근 저장 내역</h2><div id="settlementHistory"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/admin-security.js?v=66040"></script><script src="js/admin-config.js?v=66040"></script><script src="js/sbi-settlement.js?v=67079"></script><script src="js/session-status.js?v=67079"></script><script src="js/version-badge.js?v=67079"></script><script src="js/admin-mobile-nav.js?v=66040"></script></body></html>
