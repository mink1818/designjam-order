  <section class="sbi-status-card">
    <div class="sbi-status-heading"><h2>고객·실제 납품처별 상세</h2><span id="sbiStatusCount"></span></div>
    <div id="sbiStatusList"><p>출고완료 내역을 불러오는 중입니다.</p></div>
  </section>
</main>
