<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입금·미수금 관리 | 디자인 삭스</title><link rel="stylesheet" href="css/admin.css?v=66200">
<meta name="theme-color" content="#112437"><link rel="manifest" href="manifest-admin.webmanifest?v=66040"><link rel="icon" href="icons/admin-192.png?v=66040"></head>
<body class="auth-pending login-stable" data-session-page="admin" data-pwa-app="admin" data-app-version="6.6.73">
<header><h1>💰 입금·미수금 관리</h1><p>주문별 입금액과 남은 미수금을 확인합니다.</p></header>
<main class="container payment-page">
 <section class="product-card payment-toolbar">
  <label>거래처<select id="paymentCustomer"><option value="all">전체 거래처</option></select></label>
  <label>시작일<input id="paymentStartDate" type="date"></label>
  <label>종료일<input id="paymentEndDate" type="date"></label>
  <label>입금 상태<select id="paymentStatus"><option value="all">전체</option><option value="미입금">미입금</option><option value="일부입금">일부입금</option><option value="입금완료">입금완료</option></select></label>
  <label class="payment-search">주문·거래처 검색<input id="paymentSearch" type="search" placeholder="주문번호 또는 거래처명"></label>
  <button id="paymentRefresh" class="cart-btn" type="button">새로고침</button>
 </section>
 <section id="paymentSummary" class="v3-metric-grid payment-summary"></section>
 <section class="product-card payment-customer-section"><div class="v3-section-heading"><h2>거래처별 미수금</h2><span>기본 최근 1개월</span></div><div id="paymentCustomerList" class="payment-customer-list"></div></section><section id="paymentDailySection" class="product-card" hidden><div class="v3-section-heading"><h2>선택 거래처 일별 합계</h2><span id="paymentDailyCaption"></span></div><div id="paymentDailyTotals"></div></section>
 <section><div class="v3-section-heading"><h2>주문별 입금 관리</h2><span id="paymentResultCount"></span></div><div id="paymentOrderList" class="payment-order-list"><p>불러오는 중입니다.</p></div></section>
 <p id="paymentMessage" class="stats-message" role="status"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/admin-security.js?v=66040"></script><script src="js/payments.js?v=66470"></script><script src="js/session-status.js?v=66390"></script><script src="js/pwa.js?v=66180"></script><script src="js/admin-page-transition.js?v=66673"></script><script src="js/version-badge.js?v=66673"></script><script src="js/back-navigation.js?v=66040"></script><script src="js/ui-preferences.js?v=66040"></script><script src="js/admin-mobile-nav.js?v=66040"></script><script src="js/admin-new-order-alert.js?v=66673"></script></body></html>
