<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거래처 관리메모 | 디자인 삭스</title><link rel="stylesheet" href="css/admin.css?v=66676"><link rel="stylesheet" href="css/customer-notes.css?v=66676"><meta name="theme-color" content="#112437"></head>
<body class="auth-pending login-stable" data-session-page="admin" data-pwa-app="admin" data-app-version="6.6.76">
<header><h1>📝 거래처 관리메모</h1><p>거래처별 내부 메모를 항목별로 관리합니다.</p></header>
<main class="container customer-notes-page">
<section class="notes-toolbar-card"><div><h2>거래처 메모 목록</h2><p>거래처별 카드는 평소 접혀 있고, 펼치면 여러 메모를 계속 추가할 수 있습니다.</p></div><button id="addCustomerCardBtn" type="button">+ 거래처 추가</button></section>
<section id="newCustomerPanel" class="new-customer-panel" hidden><label>거래처 검색<input id="newCustomerSearch" type="search" autocomplete="off" placeholder="거래처명 또는 초성 검색 (예: ㅅㅁㄱ)"><span id="newCustomerSelected" class="new-customer-selected" hidden></span><div id="newCustomerSuggestions" class="new-customer-suggestions" hidden></div></label><button id="createCustomerCardBtn" type="button" disabled>메모 항목 만들기</button><button id="cancelCustomerCardBtn" class="gray-btn" type="button">취소</button></section>
<section class="notes-filter-bar"><input id="customerNoteSearch" type="search" placeholder="거래처명 검색"><select id="customerNoteSort"><option value="recent">최근 메모순</option><option value="name">거래처명순</option><option value="count">메모 많은순</option></select></section>
<div id="customerNotesList" class="customer-notes-list"><p class="notes-loading">거래처 메모를 불러오는 중입니다.</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/admin-security.js?v=66040"></script><script src="js/ui-preferences.js?v=66040"></script><script src="js/customer-notes.js?v=66676"></script><script src="js/session-status.js?v=66390"></script><script src="js/admin-page-transition.js?v=66676"></script><script src="js/version-badge.js?v=66676"></script><script src="js/back-navigation.js?v=66040"></script><script src="js/admin-mobile-nav.js?v=66040"></script></body></html>
