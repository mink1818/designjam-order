<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디자인 삭스 생산공장 주문관리</title><link rel="stylesheet" href="css/admin.css?v=6480"><style>.factory-shell{max-width:1200px;margin:auto;padding:18px}.factory-toolbar,.factory-card{background:#fff;border:1px solid #d8e1eb;border-radius:16px;padding:16px;margin-bottom:14px}.factory-tabs{display:flex;gap:8px}.factory-tabs button{flex:1;padding:13px;border:0;border-radius:10px;font-weight:900}.factory-tabs button.active{background:#173f70;color:#fff}.factory-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.factory-actions button{padding:11px 15px;border:0;border-radius:9px;background:#24579c;color:#fff;font-weight:900}.factory-list-row{display:grid;grid-template-columns:1fr 110px;padding:9px;border-bottom:1px solid #e2e8f0}.factory-record{border:1px solid #d8e1eb;border-radius:12px;padding:13px;margin:9px 0}.factory-record-head{display:flex;justify-content:space-between;gap:10px}.factory-record small{display:block;color:#64748b}.factory-record select{padding:8px}.factory-note{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bcc9d6;border-radius:9px}@media(max-width:650px){.factory-shell{padding:9px}.factory-record-head{display:block}.factory-list-row{grid-template-columns:1fr 70px}}html[data-theme=dark] .factory-toolbar,html[data-theme=dark] .factory-card,html[data-theme=dark] .factory-record{background:#172234;color:#eef5ff;border-color:#40536b}</style></head><body class="auth-pending" data-session-page="admin" data-app-version="6.4.8"><header><h1>🏭 생산공장 주문관리</h1><p>S·B·I 공장별 품번 발주 생성·복사·기록</p></header><main class="factory-shell"><section class="factory-toolbar"><div class="factory-tabs"><button data-factory="S" class="active">S 공장</button><button data-factory="B">B 공장</button><button data-factory="I">I 공장</button></div><p id="factorySummary"></p><input id="factoryNote" class="factory-note" placeholder="발주 메모(선택)"><div clas
